<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimentação de gastos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <main>
      <a href="/"><img src="imagens/icones/voltar.svg" /></a>
      <div class="header-movimentacoes">
        <h1>Nome do período</h1>
        <button class="btn-add-movimentacao btn-abrir-modal">
          <img src="imagens/icones/adicionar.svg" />
        </button>
      </div>
      <p class="p-empty-state">Nenhuma movimentação registrada</p>
      <table class="tabela-movimentacoes">
        <tbody></tbody>
      </table>
    </main>
    <dialog id="modal">
      <form class="form-modal">
        <fieldset>
          <div>
            <label for="nome-movimentacao">Anotar movimentação:</label>
            <img
              src="imagens/icones/fechar.svg"
              class="btn-fechar-modal"
              style="cursor: pointer"
            />
          </div>
          <input
            type="text"
            name="movimentacao"
            id="nome-movimentacao"
            placeholder="Ex: Saída: R$ 10 - chiclete"
            class="input-modal"
            value="Saída: R$"
          />
        </fieldset>
        <div>
          <button class="btn-submit">Adicionar</button>
        </div>
      </form>
    </dialog>
    <script src="js/periodo.js" type="module"></script>
    <script src="js/utils.js" type="module"></script>
  </body>
</html>
