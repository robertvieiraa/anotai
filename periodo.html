<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimentação de gastos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <main>
      <a href="/"><img src="imagens/icones/voltar.svg" /></a>
      <div class="header-movimentacoes">
        <h1>Nome do período</h1>
        <button class="btn-add-movimentacao">
          <img src="imagens/icones/adicionar.svg" />
        </button>
      </div>
      <table class="tabela-movimentacoes">
        <tbody></tbody>
      </table>
    </main>
    <dialog id="modal">
      <form class="form-modal">
        <fieldset>
          <div>
            <label for="nome-movimentacao">Anotar movimentação:</label>
            <img
              src="imagens/icones/fechar.svg"
              class="btn-fechar-modal"
              style="cursor: pointer"
            />
          </div>
          <input
            type="text"
            name="movimentacao"
            id="nome-movimentacao"
            placeholder="Ex: Saída: R$ 10 - chiclete"
            class="input-modal"
            value="Saída: R$"
          />
        </fieldset>
        <div>
          <button class="btn-submit">Adicionar</button>
        </div>
      </form>
    </dialog>
    <script>
      let parametros = new URLSearchParams(window.location.search);
      let idPeriodo = parametros.get("periodo");
      let btnAddMovimentacao = document.querySelector(".btn-add-movimentacao");
      let modal = document.getElementById("modal");
      let btnFecharModal = document.querySelector(".btn-fechar-modal");
      let h1 = document.querySelector("h1");
      let inputModal = document.querySelector(".input-modal");
      let formModal = document.querySelector(".form-modal");
      let corpoTabela = document.querySelector("tbody");
      let periodos = JSON.parse(localStorage.getItem("periodos"));
      let periodoSelecionado = periodos.find((p) => p.id == idPeriodo);
      let movimentacoes = periodoSelecionado.movimentacoes;

      formModal.addEventListener("submit", (e) => {
        e.preventDefault();
        let movimentacao = {
          id: crypto.randomUUID(),
          descricao: inputModal.value,
        };
        let elementoMovimentacao = criarElementoMovimentacao(movimentacao);

        corpoTabela.append(elementoMovimentacao);
        movimentacoes.push(movimentacao);
        localStorage.setItem("periodos", JSON.stringify(periodos));
        modal.close();
        inputModal.value = "Saída: R$";
      });

      movimentacoes.forEach((m) => {
        let elementoMovimentacao = criarElementoMovimentacao(m);
        corpoTabela.append(elementoMovimentacao);
      });

      function criarElementoMovimentacao(movimentacao) {
        let tr = document.createElement("tr");
        let td = document.createElement("td");
        td.textContent = movimentacao.descricao;

        tr.append(td);

        return tr;
      }

      btnAddMovimentacao.addEventListener("click", () => {
        modal.showModal();
      });

      btnFecharModal.addEventListener("click", () => {
        modal.close();
      });

      h1.textContent = periodoSelecionado.nome;
    </script>
  </body>
</html>
