<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anotaí</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="imagens/favicon/favicon.ico"
      type="image/x-icon"
    />
    <link rel="apple-touch-icon" href="imagens/favicon/apple-touch-icon.png" />
  </head>
  <body>
    <main>
      <a href="/"><img src="imagens/icones/voltar.svg" /></a>
      <div class="header-movimentacoes">
        <h1></h1>
        <button class="btn-add-movimentacao btn-abrir-modal">
          <img src="imagens/icones/adicionar.svg" />
        </button>
      </div>
      <p class="p-empty-state">Nenhuma movimentação registrada</p>
      <table class="tabela-movimentacoes">
        <tbody></tbody>
      </table>
    </main>
    <dialog id="modal">
      <form class="form-modal">
        <div class="informar-nome">
          <div>
            <label for="nome-movimentacao">Anotar movimentação:</label>
            <img
              src="imagens/icones/fechar.svg"
              class="btn-fechar-modal"
              style="cursor: pointer"
            />
          </div>
          <input
            type="text"
            name="movimentacao"
            id="nome-movimentacao"
            placeholder="Ex: Saída: R$ 10 - chiclete"
            class="input-modal"
            value="Saída: R$ "
            required
          />
        </div>
        <div class="informar-valor-input">
          <p>Exibir valor padrão:</p>
          <div>
            <label for="radio-valor-ativo">
              <input
                type="radio"
                name="valor-input"
                id="radio-valor-ativo"
                checked
              />
              Sim
            </label>
            <label for="radio-valor-passivo">
              <input type="radio" name="valor-input" id="radio-valor-passivo" />
              Não
            </label>
          </div>
        </div>
        <button class="btn-submit">Adicionar</button>
      </form>
    </dialog>
    <script src="js/periodo.js" type="module"></script>
    <script src="js/utils.js" type="module"></script>
  </body>
</html>
