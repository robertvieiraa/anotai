<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anotaí</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="imagens/favicon/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="imagens/favicon/apple-touch-icon.png">
  </head>
  <body>
    <main>
      <h1></h1>
      <ul class="lista-periodos"></ul>
      <p class="p-empty-state">Nenhum período criado ainda</p>
      <button class="btn-add-periodo btn-abrir-modal">
        <img src="imagens/icones/adicionar.svg" />
      </button>
    </main>
    <footer>
      <div class="links-footer">
        <a href="https://github.com/robertvieiraa"><img src="imagens/icones/github.svg"></a>
        <a href="#"><img src="imagens/icones/instagram.svg"></a>
      </div>
      <p><span style="color: var(--primaria);">Anotaí</span>. Desenvolvido por Robert Vieira.</p>
    </footer>
    <dialog id="modal">
      <form class="form-modal">
        <fieldset>
          <div>
            <label for="periodo">Nome do período:</label>
            <img
              src="imagens/icones/fechar.svg"
              class="btn-fechar-modal"
              style="cursor: pointer"
            />
          </div>
          <input
            type="text"
            name="periodo"
            id="periodo"
            placeholder="Ex: Janeiro"
            class="input-modal"
          />
        </fieldset>
        <div>
          <button class="btn-submit">Criar</button>
        </div>
      </form>
    </dialog>
    <script src="js/main.js" type="module"></script>
    <script src="js/utils.js" type="module"></script>
  </body>
</html>
