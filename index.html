<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimentação de gastos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Períodos</h1>
      <ul class="lista-periodos">
        <!-- <li class="card-periodo" data-periodo="07-2026">
          <div class="capa-periodo"></div>
          <p class="nome-periodo">Julho</p>
        </li>
        <li class="card-periodo" data-periodo="06-2026">
          <div class="capa-periodo"></div>
          <p class="nome-periodo">Junho</p>
        </li> -->
      </ul>
      <button class="btn-add-periodo">
        <img src="icones/adicionar.svg" />
      </button>
    </main>
    <dialog id="modal">
      <form class="form-modal">
        <fieldset>
          <div>
            <label for="periodo">Nome do período:</label>
            <img
              src="icones/fechar.svg"
              class="btn-fechar-modal"
              style="cursor: pointer"
            />
          </div>
          <input
            type="text"
            name="periodo"
            id="periodo"
            placeholder="Ex: Janeiro"
            class="input-modal"
          />
        </fieldset>
        <div>
          <button class="btn-submit">Criar</button>
        </div>
      </form>
    </dialog>
    <script src="main.js"></script>
  </body>
</html>
